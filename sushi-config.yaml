id: hl7.fhir.be.workflow
canonical: https://www.ehealth.fgov.be/standards/fhir/workflow
url: https://www.ehealth.fgov.be/standards/fhir/workflow
name: BeWorkflow
title: "BREW - Belgian Requests & Execution Workflows"
description: "Belgian guidance for request and Task based workflows in FHIR, adapting the HL7 Clinical Order Workflows (COW) IG: where Tasks are kept, when to use contained resources, and the Task codes used in Belgium."
status: draft
license: CC0-1.0
date: 2026-11-11
version: 0.1.0
fhirVersion: 4.0.1
FSHOnly: false
applyExtensionMetadataToRoot: false
copyrightYear: 2026+
releaseLabel: ci-build
jurisdiction: urn:iso:std:iso:3166#BE "Belgium"

dependencies:
  hl7.fhir.be.core: 2.1.2
  # COW 1.0.0-ballot predates the COW Task codes; pin to a release once COW publishes one.
  hl7.fhir.uv.cow: current

publisher:
  name: eHealth Platform
  url: https://www.ehealth.fgov.be/standards/fhir
  email: support@be-ehealth-standards.atlassian.net

contact:
  - name: Message Structure eHealth
    telecom:
      - system: email
        value: support@be-ehealth-standards.atlassian.net
        use: work

